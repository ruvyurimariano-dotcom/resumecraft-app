name: resumecraft
description: A modern, professional, Android-only Resume Maker mobile application built with Flutter and Material 3.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
